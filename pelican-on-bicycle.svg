    <ellipse cx="236" cy="106" rx="44" ry="26"/>
    <ellipse cx="128" cy="108" rx="36" ry="22"/>
    <ellipse cx="470" cy="62" rx="50" ry="21"/>
    <ellipse cx="520" cy="54" rx="30" ry="16"/>
  </g>
