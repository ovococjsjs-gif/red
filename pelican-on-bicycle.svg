    <path d="M700 168 C 718 154, 736 138, 748 124" stroke="#e2996a" stroke-width="3.5" opacity="0.45"/>
  </g>
  <!-- клюв: надклювье -->
  <path d="M566 78 C 632 76, 700 92, 762 114 C 776 119, 780 132, 770 134
           C 706 118, 632 104, 566 102 Z"
        fill="url(#beakG)" stroke="#d98a1e" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M572 84 C 636 84, 700 100, 756 122" fill="none" stroke="#ffe6bd" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
  <ellipse cx="606" cy="88" rx="5.5" ry="3" fill="#c9761a" transform="rotate(-4 606 88)"/>

  <!-- ================= скорость ================= -->
  <g stroke="#8fb6c6" stroke-width="6" stroke-linecap="round" opacity="0.55">
    <path d="M150 300 L 216 300"/>
    <path d="M112 348 L 206 348"/>
    <path d="M162 398 L 224 398"/>
  </g>
  <g fill="#e0a13a" opacity="0.75">
    <circle cx="184" cy="228" r="7"/>
    <circle cx="128" cy="266" r="5"/>
    <circle cx="234" cy="200" r="4"/>
  </g>
</svg>
