  <circle cx="507" cy="298" r="8" fill="#e8873a" stroke="#c0671c" stroke-width="2.2"/>
  <circle cx="543" cy="400" r="6.5" fill="#e8873a" stroke="#c0671c" stroke-width="2.2"/>
