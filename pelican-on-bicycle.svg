<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" role="img" aria-label="Пеликан едет на велосипеде">
  <title>Пеликан на велосипеде</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfeaf7"/>
      <stop offset="0.65" stop-color="#eaf6f6"/>
      <stop offset="1" stop-color="#fdf3e0"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9dcbf"/>
      <stop offset="1" stop-color="#d9c8a4"/>
    </linearGradient>
    <linearGradient id="bodyG" x1="0.1" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#faf5ea"/>
      <stop offset="1" stop-color="#e3dac3"/>
    </linearGradient>
    <linearGradient id="neckG" x1="0.1" y1="0.1" x2="0.9" y2="0.9">
      <stop offset="0" stop-color="#fffefa"/>
      <stop offset="1" stop-color="#e8dfc9"/>
    </linearGradient>
    <linearGradient id="headG" x1="0.2" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ebe2cd"/>
    </linearGradient>
    <linearGradient id="beakG" x1="0" y1="0" x2="0.1" y2="1">
      <stop offset="0" stop-color="#ffd15a"/>
      <stop offset="1" stop-color="#efa023"/>
    </linearGradient>
    <linearGradient id="pouchG" x1="0.05" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#fce4bb"/>
      <stop offset="0.5" stop-color="#f8cd90"/>
      <stop offset="1" stop-color="#eba85c"/>
    </linearGradient>
    <linearGradient id="wingG" x1="0.05" y1="0" x2="0.9" y2="0.9">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#f7f1e4"/>
      <stop offset="1" stop-color="#e4dbc4"/>
    </linearGradient>
    <linearGradient id="frameG" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ec5d4f"/>
      <stop offset="1" stop-color="#bf2f25"/>
    </linearGradient>
    <radialGradient id="tireG" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0.7" stop-color="#3b4048"/>
      <stop offset="1" stop-color="#22252b"/>
    </radialGradient>
    <radialGradient id="hubG" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#fdfefe"/>
      <stop offset="1" stop-color="#98a2ad"/>
    </radialGradient>
    <radialGradient id="shadowG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8d7f60" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8d7f60" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ================= фон ================= -->
  <rect width="1000" height="700" fill="url(#sky)"/>
  <circle cx="880" cy="104" r="58" fill="#ffe9a8" opacity="0.8"/>
  <circle cx="880" cy="104" r="40" fill="#ffe07a"/>
  <g fill="#ffffff" opacity="0.75">
