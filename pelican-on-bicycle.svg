    <rect x="-17" y="-66" width="34" height="62" rx="10" fill="#c3cad3"/>
    <rect x="-13" y="-62" width="26" height="54" rx="8" fill="#5aa9cb"/>
    <rect x="-8" y="-72" width="16" height="12" rx="4" fill="#e3e8ee"/>
  </g>
  <path d="M646 270 C 674 252, 692 248, 712 252 C 742 258, 774 254, 802 244"
        fill="none" stroke="#8f979f" stroke-width="10" stroke-linecap="round"/>
  <path d="M786 250 C 796 246, 804 243, 811 242" fill="none" stroke="#2f343a" stroke-width="13" stroke-linecap="round"/>
  <path d="M644 270 C 654 266, 662 264, 668 264" fill="none" stroke="#2f343a" stroke-width="13" stroke-linecap="round"/>
  <path d="M394 266 C 410 254, 452 250, 468 258 C 474 264, 458 274, 428 274 C 406 274, 392 272, 394 266 Z" fill="#3a3f46"/>
  <path d="M400 262 C 416 256, 444 254, 462 257" fill="none" stroke="#5b636d" stroke-width="3" stroke-linecap="round"/>

