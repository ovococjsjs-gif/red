  <circle cx="500" cy="462" r="9" fill="url(#hubG)"/>

  <!-- ================= ближняя нога ================= -->
  <path d="M424 228 C 458 244, 492 268, 512 296 C 532 326, 544 362, 548 400
           C 552 432, 552 462, 554 486 L 540 486
