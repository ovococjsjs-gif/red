  <g fill="#f7f1e4" stroke="#c9bda1" stroke-width="2.6" stroke-linejoin="round">
    <path d="M324 170 C 298 148, 272 128, 248 114 C 250 134, 256 152, 266 168 C 284 176, 306 176, 324 178 Z"/>
    <path d="M326 184 C 298 176, 268 168, 240 162 C 248 180, 262 194, 278 202 C 296 194, 314 190, 326 190 Z"/>
    <path d="M326 196 C 300 198, 276 202, 254 208 C 266 222, 282 230, 298 232 C 306 220, 316 206, 326 200 Z"/>
  </g>

  <!-- тело -->
  <g transform="rotate(-18 398 198)">
    <ellipse cx="398" cy="198" rx="86" ry="60" fill="url(#bodyG)" stroke="#c9bda1" stroke-width="2.8"/>
    <ellipse cx="392" cy="220" rx="66" ry="34" fill="#efe8d6" opacity="0.8"/>
    <path d="M348 160 C 380 140, 428 138, 458 154" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.9"/>
