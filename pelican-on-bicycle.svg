  <path d="M706 326 C 712 380, 712 424, 712 468" fill="none" stroke="#f9ddf5" stroke-width="3" stroke-dasharray="7 11" opacity="0.5"/>
  <g stroke="#aeb6bf" stroke-width="7" stroke-linecap="round" fill="none">
