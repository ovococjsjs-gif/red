  <path d="M0 578 C 160 566, 340 592, 520 578 C 700 564, 860 588, 1000 576" fill="none" stroke="#c9b68f" stroke-width="5" opacity="0.8"/>
  <g stroke="#cbb994" stroke-width="4" stroke-linecap="round" opacity="0.7">
