    <circle r="88" fill="none" stroke="#c3cad3" stroke-width="6"/>
    <g stroke="#b9c1cb" stroke-width="1.7" stroke-linecap="round">
      <line y1="-84" y2="-16" transform="rotate(0)"/><line y1="-84" y2="-16" transform="rotate(30)"/>
      <line y1="-84" y2="-16" transform="rotate(60)"/><line y1="-84" y2="-16" transform="rotate(90)"/>
      <line y1="-84" y2="-16" transform="rotate(120)"/><line y1="-84" y2="-16" transform="rotate(150)"/>
      <line y1="-84" y2="-16" transform="rotate(180)"/><line y1="-84" y2="-16" transform="rotate(210)"/>
      <line y1="-84" y2="-16" transform="rotate(240)"/><line y1="-84" y2="-16" transform="rotate(270)"/>
      <line y1="-84" y2="-16" transform="rotate(300)"/><line y1="-84" y2="-16" transform="rotate(330)"/>
    </g>
    <circle r="16" fill="url(#hubG)"/>
    <circle r="6" fill="#6f7883"/>
  </g>

