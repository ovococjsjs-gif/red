  <path d="M444 170 C 456 130, 476 108, 502 104" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.85"/>

  <!-- голова -->
  <circle cx="540" cy="92" r="41" fill="url(#headG)" stroke="#c9bda1" stroke-width="2.8"/>
  <circle cx="549" cy="80" r="11" fill="#f2ecdc" stroke="#cdc1a5" stroke-width="2"/>
  <circle cx="550" cy="80" r="7.6" fill="#2f343a"/>
  <circle cx="552" cy="77.5" r="2.7" fill="#ffffff"/>
  <path d="M536 68 C 544 62, 558 62, 566 68" fill="none" stroke="#c9bda1" stroke-width="3" stroke-linecap="round"/>
  <path d="M520 66 C 534 52, 552 46, 566 48" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.8"/>

  <!-- клюв: мешок -->
  <path d="M566 104 C 632 100, 700 110, 766 122 C 736 160, 698 190, 646 190 C 594 190, 558 152, 560 108 Z"
