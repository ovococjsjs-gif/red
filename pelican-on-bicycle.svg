  <ellipse cx="310" cy="583" rx="120" ry="18" fill="url(#shadowG)"/>
  <ellipse cx="712" cy="583" rx="120" ry="18" fill="url(#shadowG)"/>

  <!-- ================= дальняя нога (за рамой) ================= -->
  <g>
